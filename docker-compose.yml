version: '3.8'

services:
  gateway-service:
    build:
      context: ./packages/backend/services/gateway-service
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=development
      - PORT=4000

  device-service:
    build:
      context: ./packages/backend/services/device-service
    ports:
      - "4001:4001"
    environment:
      - NODE_ENV=development
      - PORT=4001

  data-service:
    build:
      context: ./packages/backend/services/data-service
    ports:
      - "4002:4002"
    environment:
      - NODE_ENV=development
      - PORT=4002

  workflow-service:
    build:
      context: ./packages/backend/services/workflow-service
    ports:
      - "4003:4003"
    environment:
      - NODE_ENV=development
      - PORT=4003

  control-service:
    build:
      context: ./packages/backend/services/control-service
    ports:
      - "4004:4004"
    environment:
      - NODE_ENV=development
      - PORT=4004

  alert-service:
    build:
      context: ./packages/backend/services/alert-service
    ports:
      - "4005:4005"
    environment:
      - NODE_ENV=development
      - PORT=4005

  analytics-service:
    build:
      context: ./packages/backend/services/analytics-service
    ports:
      - "4006:4006"
    environment:
      - NODE_ENV=development
      - PORT=4006

  audit-service:
    build:
      context: ./packages/backend/services/audit-service
    ports:
      - "4007:4007"
    environment:
      - NODE_ENV=development
      - PORT=4007

  websocket-service:
    build:
      context: ./packages/backend/services/websocket-service
    ports:
      - "4008:4008"
    environment:
      - NODE_ENV=development
      - PORT=4008

  web-dashboard:
    build:
      context: ./packages/frontend/web-dashboard
    ports:
      - "5173:80"
    environment:
      - NODE_ENV=development

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  timescaledb:
    image: timescale/timescaledb:latest-pg14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nibe_dim
    volumes:
      - timescale_data:/var/lib/postgresql/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  mqtt-broker:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

volumes:
  mongodb_data:
  redis_data:
  timescale_data:
  mosquitto_data:
  mosquitto_log:

